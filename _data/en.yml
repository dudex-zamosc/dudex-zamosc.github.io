# About
about:
  title: "About Us"
  description: "Dudex has been operating in the carpentry industry since 1981. The company was founded by Mieczysław Dudek — we are now continuing the business in the second generation. From the very beginning, we have been producing parquet, floors and stairs. We owe our long presence on the market to our good reputation and commitment to the quality of our services. Our clients often return to us, entrusting us with new projects."
  experience: "Years of experience"
  projects_done: "Completed projects"
  satisfaction: "Satisfied customers"

# Services
services:
  title: "Our Services"
  subtitle: "We serve individual clients and collaborate with architects and interior designers"
  floors:
    title: "Parquet & Floors"
    description: "We produce decorative and traditional parquet using exotic and traditional Polish wood species. We manufacture floorboards and undertake restoration of old, historic floors and parquet."
  stairs:
    title: "Wooden Stairs"
    description: "We build structural wooden stairs as well as concrete stairs clad in wood. Every project is custom-made with attention to every detail."
  sanding:
    title: "Floor Sanding"
    description: "Professional sanding of hardwood floors and parquet. We restore the shine to old floors using modern equipment."
    url: "/en/services/floor-sanding/"
  varnishing:
    title: "Varnishing & Oiling"
    description: "Floor varnishing and oiling services. We use top-quality products that provide lasting protection and a beautiful appearance."
    url: "/en/services/varnishing/"

