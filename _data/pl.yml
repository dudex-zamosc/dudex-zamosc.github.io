# About
about:
  title: "O firmie"
  description: "Firma Dudex działa w branży stolarskiej od 1981 roku. Założycielem firmy był Mieczysław Dudek — obecnie kontynuujemy działalność w drugim pokoleniu. Od początku zajmujemy się produkcją parkietów, podłóg i schodów. Długi okres działalności zawdzięczamy dobrej renomie na rynku i dbałości o poziom wykonywanych usług. Nasi zleceniodawcy niejednokrotnie powracają do nas, powierzając nam realizację nowych projektów."
  experience: "Lat doświadczenia"
  projects_done: "Zrealizowanych projektów"
  satisfaction: "Zadowolonych klientów"

# Services
services:
  title: "Nasze usługi"
  subtitle: "Realizujemy zamówienia klientów indywidualnych oraz współpracujemy z architektami i dekoratorami wnętrz"
  floors:
    title: "Parkiety i podłogi"
    description: "Wykonujemy parkiety ozdobne i tradycyjne z elementami drewna egzotycznego i tradycyjnych polskich gatunków drzew. Produkujemy deski podłogowe. Podejmujemy się renowacji starych zabytkowych podłóg i parkietów."
  stairs:
    title: "Schody drewniane"
    description: "Wykonujemy schody drewniane konstrukcyjne oraz betonowe obłożone drewnem. Każdy projekt realizujemy na wymiar z dbałością o każdy detal."
  sanding:
    title: "Cyklinowanie podłóg"
    description: "Profesjonalne szlifowanie i cyklinowanie podłóg drewnianych oraz parkietów. Przywracamy blask starym podłogom, stosując nowoczesny sprzęt."
    url: "/uslugi/cyklinowanie-podlog/"
  varnishing:
    title: "Lakierowanie i olejowanie"
    description: "Usługi lakierowania oraz olejowania podłóg drewnianych. Stosujemy produkty najwyższej jakości, zapewniające trwałą ochronę i piękny wygląd."
    url: "/uslugi/lakierowanie/"

# Why us
why_us:
  title: "Dlaczego Dudex?"
  subtitle: "Ponad 40 lat doświadczenia i setki zadowolonych klientów"
  reasons:
    - title: "Ponad 40 lat tradycji"
      description: "Działamy od 1981 roku — to ponad cztery dekady doświadczenia w branży stolarskiej i parkieciarskiej."
      icon: "shield-check"
    - title: "Własne suszarnie"
      description: "Posiadamy własne suszarnie drewna. Prace mogą być realizowane z drewna powierzonego, jak również z naszego materiału."
      icon: "cube"
    - title: "Drugie pokolenie"
      description: "Firma założona przez Mieczysława Dudka jest kontynuowana w drugim pokoleniu, łącząc tradycję z nowoczesnymi rozwiązaniami."
      icon: "user"
    - title: "Indywidualne podejście"
      description: "Każdy projekt traktujemy indywidualnie. Współpracujemy z architektami i dekoratorami wnętrz przy aranżacji."
      icon: "clock"
    - title: "Dobra renoma"
      description: "Nasi zleceniodawcy niejednokrotnie powracają do nas, powierzając realizację kolejnych projektów."
      icon: "document-check"
    - title: "Uczciwa cena"
      description: "Oferujemy bardzo dobry towar w rozsądnej cenie. Bezpłatna wycena i doradztwo w zakresie doboru materiałów."
      icon: "calculator"

